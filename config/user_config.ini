; polo 自用配置覆盖
; ------------------------------------------------------------------
; 为什么叫 user_config.ini：同 user_subscribe.txt，靠 `user_` 前缀隔离，
; `Sync fork` 不会覆盖它。
;
; ⚠️ 顶部的 [Settings] 必须保留，否则下面的自定义配置不会生效（官方教程明确警告）。
;
; 这里只写「要改的项」，不用抄 config.ini 全文。
; 每一项的默认值我都列在注释里，方便你随时对照 / 回滚。
; ------------------------------------------------------------------

[Settings]

; ========== 结果文件位置 ==========
; 默认值: source_file = config/demo.txt ｜ final_file = output/result.txt
; 指向我们自己的 user_ 文件，与上游隔离
source_file = config/user_demo.txt
final_file = output/user_result.txt

; ========== 合规：关掉推流 ==========
; 默认值: True（新版默认居然是开的）
; RTMP 推流会把接口内容再转发出去，涉及版权风险，而且 Actions 里也用不到。
; 本项目只做「生成订阅列表给自家电视看」，必须关掉。
open_rtmp = False

; ========== 避免某些台结果为空 ==========
; 默认值: False
; 开启后，当某频道满足条件的接口不足时，会把「不达标但可能可用」的接口补进来，
; 且不匹配 location/isp 的接口不再直接丢弃，而是降权排到该频道末尾。
; 对国内源这种参差不齐的情况，建议开启。
open_supply = True

; ========== 归档建议（可自行调整）==========
; 默认值: min_resolution = 1280x720 ｜ min_speed = 0.5
;
; ⚠️ 这两个默认值对国内公开源偏严，是「跑完发现很多台没有结果」的常见原因。
; 建议：先按默认跑一次，看 Summary / 日志里「无结果频道」有多少。
;   - 如果基本都有结果 → 保持默认（画质与流畅度更有保障）
;   - 如果大量台为空 → 回来放开下面两行（降到 960x540 / 0.3，或只放宽速率）
;
; min_resolution = 960x540
; min_speed = 0.3

; ========== 归属地偏好（可选）==========
; 默认值: 空（不限制）
; 填「广东」会只保留广东归属地的接口 —— 离你近、理论上更快，
; 但会大幅减少候选数量。配合上面的 open_supply = True 使用，
; 效果是「优先广东、不足时降权补其他地区」，比较稳。
;
; location = 广东

; ========== 每频道接口数 ==========
; 默认值: 5
; 每次导出 5 条备选，电视端播不动时会自动往后试。想列表更碎可调小。
output_urls_limit = 5

; ========== IPv6（按需）==========
; 默认值: ipv6_support = False
; 程序会先检测运行环境是否支持 IPv6；GitHub 托管 runner 的 IPv6 支持不稳定，
; 所以结果里 IPv6 接口可能偏少。若你家宽带确定支持且想保留 IPv6 源，可放开下面这行。
;
; ipv6_support = True

; ========== EPG（可选）==========
; 默认值: open_subscribe_epg = False
; 开启后会从订阅源 m3u 头部自动提取 EPG 地址并合并节目单，
; 能白拿节目预告，但会增加解析开销与耗时（本次运行本来就要 30 分钟以上）。
;
; open_subscribe_epg = True
